name: Apply audit fixes

on:
  push:
    branches:
      - fix/todo-audit-bugs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/todo-audit-bugs
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded fixes
        run: node scripts/apply-audit-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit generated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js server.js public/app.js macos/ConsoleApp.swift macos/widget/TodoModels.swift
          git commit -m "fix: harden todo reliability [audit-fixes-applied]"
          git push origin HEAD:fix/todo-audit-bugs
